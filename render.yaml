services:
  - type: web
    name: nsfs-milestone-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: NODE_OPTIONS="--max-old-space-size=2048" npm install --include=dev --no-audit --no-fund && npm run prisma:generate && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NODE_OPTIONS
        value: "--max-old-space-size=450"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: REDIS_URL
        sync: false
